name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Bandit
        run: uv run bandit -q -r src

      - name: Dependency audit
        run: |
          uv export --format requirements-txt --no-dev --no-emit-project > requirements-audit.txt
          uvx --isolated pip-audit --strict -r requirements-audit.txt
