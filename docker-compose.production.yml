services:
  redis:
    image: redis:7-alpine
    env_file:
      - .env.production
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass $$REDIS_PASSWORD"]
    volumes:
      - monitor_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    container_name: monitor-comunitario-migrate
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run monitor-comunitario db-upgrade
    env_file:
      - .env.production
    restart: "no"

  api:
    container_name: monitor-comunitario-api
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uv run uvicorn monitor_comunitario.api.main:app
      --host 0.0.0.0
      --port 8000
    env_file:
      - .env.production
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.monitor-comunitario.rule=Host(`monitorcomunitario.soberania.cloud`)"
      - "traefik.http.routers.monitor-comunitario.entrypoints=websecure"
      - "traefik.http.routers.monitor-comunitario.tls=true"
      - "traefik.http.routers.monitor-comunitario.tls.certresolver=letsencrypt"
      - "traefik.http.routers.monitor-comunitario.middlewares=monitor-comunitario-rate-limit@docker"
      - "traefik.http.middlewares.monitor-comunitario-rate-limit.ratelimit.average=30"
      - "traefik.http.middlewares.monitor-comunitario-rate-limit.ratelimit.burst=60"
      - "traefik.http.middlewares.monitor-comunitario-rate-limit.ratelimit.period=1m"
      - "traefik.http.services.monitor-comunitario.loadbalancer.server.port=8000"
    volumes:
      - ./snapshots:/app/snapshots
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.7.3
    container_name: monitor-comunitario-cloudflared
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./ops/cloudflared:/etc/cloudflared:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  worker:
    container_name: monitor-comunitario-worker
    build:
      context: .
      dockerfile: Dockerfile
    command: uv run monitor-comunitario worker
    env_file:
      - .env.production
    volumes:
      - ./snapshots:/app/snapshots
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  monitor_redis_data:
